<title>Recueil de Recettes — Chef François Savin</title>
<style>
  :root {
    --ground: #FFFDF8; --cream: #EDE4D2; --navy: #16263E;
    --gold: #C8A020; --ink: #101824; --ink-mid: #6B7280;
    --divider: #DDD5C4; --header-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101824; --cream: #16263E; --navy: #EDE4D2;
      --gold: #C8A020; --ink: #F0EBE0; --ink-mid: #94A3B8; --divider: #1E3048;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101824; --cream: #16263E; --navy: #EDE4D2;
    --gold: #C8A020; --ink: #F0EBE0; --ink-mid: #94A3B8; --divider: #1E3048;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ground); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }

  .site-header { background: var(--ground); border-bottom: 1px solid var(--divider); height: var(--header-h); display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; position: sticky; top: 0; z-index: 100; }
  .site-logo { height: 38px; width: auto; display: block; }
  .header-title { font-family: Georgia, serif; font-size: 0.8125rem; font-style: italic; color: var(--ink-mid); letter-spacing: 0.04em; }

  .cat-nav { background: var(--ground); border-bottom: 1px solid var(--divider); display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 2.5rem; }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 0.875rem 1.25rem; font-family: inherit; font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--ink-mid); cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s; margin-bottom: -1px; }
  .cat-tab:hover { color: var(--ink); }
  .cat-tab.active { color: var(--navy); border-bottom-color: var(--gold); }

  .main { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }

  .list-header { text-align: center; margin-bottom: 2.5rem; }
  .list-eyebrow { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.5rem; }
  .gold-rule { width: 28px; height: 1px; background: var(--gold); margin: 0.625rem auto; }
  .list-title { font-family: Georgia, serif; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: normal; font-style: italic; color: var(--navy); }

  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
  .recipe-card { background: none; border: 1px solid var(--divider); padding: 1.75rem; cursor: pointer; text-align: left; width: 100%; font-family: inherit; transition: border-color 0.15s; }
  .recipe-card:hover { border-color: var(--gold); }
  .card-eyebrow { font-size: 0.5875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.5rem; }
  .card-name { font-family: Georgia, serif; font-size: 1.1875rem; font-style: italic; font-weight: normal; color: var(--navy); line-height: 1.25; margin-bottom: 0.875rem; }
  .card-meta { font-size: 0.8125rem; color: var(--ink-mid); }
  .card-arrow { display: block; margin-top: 1rem; font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-weight: 600; }

  .empty-state { text-align: center; padding: 5rem 2rem; color: var(--ink-mid); }
  .empty-state p { font-family: Georgia, serif; font-style: italic; font-size: 1rem; }

  .ref-table-title { text-align: center; font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 1.5rem; }
  .ref-table-wrap { overflow-x: auto; border: 1px solid var(--divider); }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .ref-table th { text-align: left; font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-weight: 600; padding: 0.75rem 1rem; border-bottom: 1px solid var(--divider); white-space: nowrap; }
  .ref-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--divider); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ref-table tbody tr:last-child td { border-bottom: none; }
  .ref-item { font-weight: 600; color: var(--navy); }
  .ref-item small { display: block; font-weight: normal; font-style: italic; color: var(--ink-mid); font-size: 0.75rem; white-space: normal; margin-top: 0.2rem; }

  .detail-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3rem; }
  .btn-back { background: none; border: 1px solid var(--divider); padding: 0.5rem 1rem; font-family: inherit; font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mid); cursor: pointer; }
  .btn-back:hover { border-color: var(--navy); color: var(--navy); }
  .btn-print { background: var(--gold); border: none; padding: 0.5rem 1.25rem; font-family: inherit; font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--navy); cursor: pointer; }

  .recipe-sheet { border: 1px solid var(--divider); padding: 3.5rem 4rem 3rem; background: var(--ground); }
  .sheet-header { text-align: center; margin-bottom: 2.5rem; }
  .sheet-eyebrow { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.5rem; }
  .sheet-name { font-family: Georgia, serif; font-size: clamp(1.75rem, 4.5vw, 2.5rem); font-weight: normal; font-style: italic; color: var(--navy); line-height: 1.2; text-wrap: balance; }
  .sheet-subtitle { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-top: 0.5rem; }

  .meta-strip { display: flex; flex-wrap: wrap; justify-content: center; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); margin-bottom: 2.75rem; }
  .meta-item { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.875rem 1.375rem; border-right: 1px solid var(--divider); }
  .meta-item:last-child { border-right: none; }
  .meta-label { font-size: 0.5625rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mid); font-weight: 600; }
  .meta-value { font-size: 0.875rem; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .recipe-body { display: grid; grid-template-columns: 200px 1fr; gap: 0 3rem; align-items: start; }
  .section-label { font-size: 0.5625rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 1.125rem; }
  .ingredients-col { border-right: 1px solid var(--divider); padding-right: 3rem; }
  .ingredient-row { display: grid; grid-template-columns: 52px 1fr; gap: 0 0.625rem; padding: 0.5rem 0; border-bottom: 1px solid var(--divider); align-items: baseline; }
  .ingredient-row:first-child { padding-top: 0; }
  .ingredient-row:last-child { border-bottom: none; }
  .qty { font-size: 0.8125rem; color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .ingr { font-size: 0.9375rem; color: var(--ink); line-height: 1.4; }
  .ingr small { display: block; font-size: 0.7rem; color: var(--ink-mid); font-style: italic; margin-top: 0.1rem; }

  .steps-list { list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 1.25rem; }
  .step { counter-increment: step; display: grid; grid-template-columns: 1.25rem 1fr; gap: 0 0.875rem; align-items: start; }
  .step::before { content: counter(step); font-family: Georgia, serif; font-style: italic; font-size: 0.75rem; color: var(--gold); padding-top: 0.2rem; line-height: 1; }
  .step p { font-size: 0.9375rem; line-height: 1.65; color: var(--ink); }
  .step p strong { color: var(--navy); font-weight: 600; }
  .steps-missing { font-size: 0.875rem; font-style: italic; color: var(--ink-mid); line-height: 1.6; }

  .recipe-notes { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 1px solid var(--divider); display: grid; grid-template-columns: 200px 1fr; gap: 0 3rem; }
  .notes-body { font-size: 0.875rem; color: var(--ink-mid); line-height: 1.7; }
  .notes-body p { margin-bottom: 0.375rem; }

  .sheet-footer { margin-top: 2.75rem; padding-top: 1.25rem; border-top: 1px solid var(--divider); display: flex; align-items: center; justify-content: center; gap: 0.875rem; }
  .footer-text { font-size: 0.5625rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mid); }
  .footer-dot { width: 3px; height: 3px; background: var(--gold); flex-shrink: 0; }

  .print-logo { display: none; justify-content: center; margin-bottom: 2rem; }
  .print-logo img { height: 40px; }

  @media (max-width: 600px) {
    .main { padding: 2rem 1rem 5rem; }
    .site-header { padding: 0 1.25rem; }
    .cat-nav { padding: 0 1.25rem; }
    .recipe-body { grid-template-columns: 1fr; }
    .recipe-notes { grid-template-columns: 1fr; }
    .ingredients-col { border-right: none; padding-right: 0; border-bottom: 1px solid var(--divider); padding-bottom: 2rem; margin-bottom: 2rem; }
    .recipe-sheet { padding: 2rem 1.5rem; }
    .meta-item { padding: 0.75rem 0.875rem; }
  }

  @media print {
    .site-header, .cat-nav, .detail-nav { display: none !important; }
    body { background: #fff; }
    .main { padding: 0; max-width: 100%; }
    .recipe-sheet { border: none; padding: 0; }
    .print-logo { display: flex !important; }
  }
</style>

  const rows = ref.rows.map(r => `

      <td class="ref-item">${r.item}${r.note ? `<small>${r.note}</small>` : ''}</td>
      <td>${r.em}</td>
      <td>${r.ac}</td>
      <td>${r.temps}</td>
    </tr>`).join('');

      <p class="list-eyebrow">Recueil Savin</p>

}

  const cards = recipes.map(r => `

      <span class="card-arrow">Voir la recette →</span>
    </button>`).join('');
  main.innerHTML = `<div class="list-header"><p class="list-eyebrow">Recueil Savin</p><div class="gold-rule"></div><h2 class="list-title">${CAT_LABELS[cat]}</h2></div><div class="recipe-grid">${cards}</div>`;
  main.querySelectorAll('.recipe-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = RECIPES[btn.dataset.cat].find(x => x.id === btn.dataset.id);
      if (r) renderDetail(r);
    });
  });
}

function renderDetail(r) {
  const ingRows = r.ingredients.map(i => `
    <div class="ingredient-row">
      <span class="qty">${i.qty}</span>
      <span class="ingr">${i.name}${i.note ? `<small>${i.note}</small>` : ''}</span>
    </div>`).join('');
  const steps = r.steps.length
    ? r.steps.map(s => `<li class="step"><p>${s}</p></li>`).join('')
    : '';
  const stepsColHtml = r.steps.length
    ? `<div class="steps-col"><p class="section-label">Procédé</p><ol class="steps-list">${steps}</ol></div>`
    : `<div class="steps-col"><p class="section-label">Procédé</p><p class="steps-missing">Non renseigné sur la fiche source — à compléter par François.</p></div>`;
  const metaItems = r.meta.map(m => `
    <div class="meta-item">
      <span class="meta-label">${m.label}</span>
      <span class="meta-value">${m.value}</span>
    </div>`).join('');
  const metaStripHtml = r.meta.length ? `<div class="meta-strip">${metaItems}</div>` : '';
  const notesHtml = r.notes && r.notes.length ? `
    <div class="recipe-notes">
      <p class="section-label">Notes</p>
      <div class="notes-body">${r.notes.map(n => `<p>— ${n}</p>`).join('')}</div>
    </div>` : '';

  document.getElementById('main').innerHTML = `
    <div class="detail-nav">
      <button class="btn-back" id="btn-back">← Retour</button>
      <button class="btn-print" onclick="window.print()">Imprimer / PDF</button>
    </div>
    <div class="print-logo"><img src="${LOGO_SRC}" alt="Private Chef Savin" /></div>
    <div class="recipe-sheet">
      <div class="sheet-header">
        <p class="sheet-eyebrow">Recueil Savin — ${CAT_LABELS[currentCat]}</p>
        <div class="gold-rule"></div>
        <h1 class="sheet-name">${r.name}</h1>
        <div class="gold-rule"></div>
        <p class="sheet-subtitle">${r.subtitle}</p>
      </div>
      ${metaStripHtml}
      <div class="recipe-body">
        <div class="ingredients-col"><p class="section-label">Ingrédients</p>${ingRows}</div>
        ${stepsColHtml}
      </div>
      ${notesHtml}
      <div class="sheet-footer">
        <span class="footer-text">Recueil Savin</span>
        <div class="footer-dot"></div>
        <span class="footer-text">private-chef-savin.com</span>
      </div>
    </div>`;
  document.getElementById('btn-back').addEventListener('click', () => renderList(currentCat));
}

document.getElementById('cat-nav').addEventListener('click', e => {
  const btn = e.target.closest('.cat-tab');
  if (!btn) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderList(currentCat);
});

renderList('bases');
</script>
